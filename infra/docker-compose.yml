name: arch-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arch
      POSTGRES_PASSWORD: arch
      POSTGRES_DB: arch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arch
      MINIO_ROOT_PASSWORD: arch-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local Base fork/simulacrum for contract development.
  anvil-base:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--chain-id"
      - "84532"
      - "--block-time"
      - "2"
    ports:
      - "8545:8545"

  # Local Arc simulacrum: separate chain that plays the Arc side in dev.
  # (Native-USDC gas semantics cannot be reproduced by anvil; integration tests
  # for that run against Arc testnet.)
  anvil-arc:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--chain-id"
      - "5042002"
      - "--block-time"
      - "1"
    ports:
      - "8546:8545"

volumes:
  pgdata:
  miniodata:
